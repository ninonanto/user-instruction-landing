<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Instructions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .card h2 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .card-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
            align-self: center;
        }

        .card-link:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .options {
                gap: 20px;
            }

            .card {
                padding: 30px 20px;
            }

            .card-icon {
                font-size: 3rem;
            }

            .card h2 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.95rem;
            }

            .card {
                padding: 25px 15px;
            }

            .card-icon {
                font-size: 2.5rem;
            }

            .card h2 {
                font-size: 1.3rem;
            }

            .card p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 User Instructions</h1>
            <p>Choose how you'd like to learn</p>
        </div>

        <div class="options">
            <!-- Image Instructions Card -->
            <a href="https://photos.app.goo.gl/o18QJEQ4zGRRsvzp6" target="_blank" class="card">
                <div class="card-icon">🖼️</div>
                <h2>Image Guide</h2>
                <p>Follow step-by-step instructions with detailed screenshots and annotations</p>
                <span class="card-link">View Photos</span>
            </a>

            <!-- Video Instructions Card -->
            <a href="https://drive.google.com/file/d/1qJBI1ia8DcZ61kokYOGvGKGgYVeJmpvK/view?usp=sharing" target="_blank" class="card">
                <div class="card-icon">🎥</div>
                <h2>Video Tutorial</h2>
                <p>Watch a comprehensive video walkthrough of the entire process</p>
                <span class="card-link">Watch Video</span>
            </a>
        </div>
    </div>
</body>
</html>
